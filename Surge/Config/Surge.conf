[General]
loglevel = notify
test-timeout = 5
internet-test-url = http://connectivitycheck.platform.hicloud.com/generate_204
proxy-test-url = http://1.1.1.1/generate_204
udp-priority = true
udp-policy-not-supported-behaviour = REJECT
# DNS
ipv6 = false
ipv6-vif = disabled
hijack-dns = *:53
always-real-ip = <simple-hostname>, *.lan, *.direct, *.cmpassport.com, id6.me, open.e.189.cn, mdn.open.wo.cn, opencloud.wostore.cn, auth.wosms.cn, *.10099.com.cn
show-error-page-for-reject = true
exclude-simple-hostnames = true
always-raw-tcp-hosts = 149.154.*, 91.108.*
geoip-maxmind-url = https://raw.githubusercontent.com/Loyalsoldier/geoip/release/Country.mmdb
http-api = 3139@0.0.0.0:6171
http-api-tls = false
http-api-web-dashboard = false
# --------------------
wifi-assist = true
all-hybrid = false
dns-server = system

[Proxy Group]
Proxy = select, US, HK, SG, JP, icon-url=https://raw.githubusercontent.com/Irrucky/Tool/main/Surge/icon/surge_2.png, no-alert=0, hidden=0, include-all-proxies=0
AI = select, US, SG, Proxy, icon-url=https://raw.githubusercontent.com/fmz200/wool_scripts/main/icons/apps/ChatGPT4.png, no-alert=0, hidden=0, include-all-proxies=0
TG = select, US, SG, Proxy, icon-url=https://raw.githubusercontent.com/fmz200/wool_scripts/main/icons/apps/Telegram_04.png, no-alert=0, hidden=0, include-all-proxies=0
GH = select, US, SG, Proxy, icon-url=https://raw.githubusercontent.com/fmz200/wool_scripts/main/icons/apps/github_05.png, no-alert=0, hidden=0, include-all-proxies=0
Gg = select, US, SG, Proxy, no-alert=0, hidden=0, include-all-proxies=0, icon-url=https://raw.githubusercontent.com/fmz200/wool_scripts/main/icons/apps/Google_02.png
Spo = select, DIRECT, US, SG, Proxy, icon-url=https://raw.githubusercontent.com/fmz200/wool_scripts/main/icons/apps/Spotify_03.png, no-alert=0, hidden=0, include-all-proxies=0
HK = smart, update-interval=0, no-alert=0, hidden=1, include-all-proxies=0, policy-regex-filter=(🇭🇰)|(香港)|(Hong)|(HK), icon-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/mini/HK.png, include-other-group=Port1
US = smart, update-interval=0, no-alert=0, hidden=1, include-all-proxies=0, policy-regex-filter=(🇺🇸)|(美国)|(States)|(US), icon-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/mini/US.png, include-other-group=Port1
JP = smart, update-interval=0, no-alert=0, hidden=1, include-all-proxies=0, policy-regex-filter=(🇯🇵)|(日本)|(Japan)|(JP), icon-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/mini/JP.png, include-other-group=Port1
SG = smart, update-interval=0, no-alert=0, hidden=1, include-all-proxies=0, policy-regex-filter=(🇸🇬)|(新加坡)|(Singapore)|(SG), icon-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/mini/SG.png, include-other-group=Port1
# --------------------
Port1 = select, update-interval=-1, no-alert=0, hidden=1, include-all-proxies=0, policy-path=https://sub.store/download/JiSuYun?target=Surge
# --------------------

[Rule]
# > LocalRule
RULE-SET,https://raw.githubusercontent.com/axkrr/slqhub/main/Surge/Rule/localrule.list,Proxy,"update-interval=604800"
# > AIGC
RULE-SET,https://github.com/Repcz/Tool/raw/X/Surge/Rules/AI.list,AI,"update-interval=604800"
# > TG
RULE-SET,https://github.com/Repcz/Tool/raw/X/Surge/Rules/Telegram.list,TG,"update-interval=604800"
AND,((OR,((PROCESS-NAME,Telegram), (IN-PORT,6153))), (HOSTNAME-TYPE,IPv4)),REJECT-NO-DROP
# > GH
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/GitHub/GitHub.list,GH,"update-interval=604800"
# > Gg
RULE-SET,https://github.com/Repcz/Tool/raw/X/Surge/Rules/Google.list,Gg,"update-interval=604800"
# > Spo
RULE-SET,https://github.com/Repcz/Tool/raw/X/Surge/Rules/Spotify.list,Spo,"update-interval=604800"
# > Apple
RULE-SET,https://github.com/Repcz/Tool/raw/X/Surge/Rules/AppleCN.list,DIRECT,"update-interval=604800"
RULE-SET,https://github.com/Repcz/Tool/raw/X/Surge/Rules/AppleServers.list,DIRECT,"update-interval=604800"
# --------------------
# > Direct Fix
RULE-SET,https://github.com/Repcz/Tool/raw/X/Surge/Rules/Direct.list,DIRECT,"update-interval=604800"
# > Local Aera Network
RULE-SET,LAN,DIRECT
# > CN
GEOIP,CN,DIRECT
# > FInal
FINAL,DIRECT,dns-failed

