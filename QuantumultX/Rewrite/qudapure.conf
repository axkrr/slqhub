[rewrite]
# 1. 拦截广告调度接口，返回空数据，让 App 认为没有广告可排队
^https?://api\.shanghailingye\.cn/ad/map url response-body {"code":1,"message":"成功","data":[],"bid":[]}

# 2. 拦截之前的加密配置接口（如果有的话）
^https?://api\.shanghailingye\.cn/.*config url reject-200

# 3. 拦截图片素材（你之前抓到的域名）
^https?://pic\.fancyapi\.com/upload/ftx/creative/.* url reject-200

[mitm]
# 必须加上这个域名，否则无法拦截 POST 里面的内容
hostname = api.shanghailingye.cn, pic.fancyapi.com

