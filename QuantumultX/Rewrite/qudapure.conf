[rewrite]
# 1. 核心调度拦截：使用脚本修改返回体 (解决 invalid line 报错)
^https?://api\.shanghailingye\.cn/ad/map url script-response-body https://raw.githubusercontent.com/yichahucha/surge/master/crack_scripts/general_ads_block.js

# 2. 拦截备用配置接口
^https?://api\.shanghailingye\.cn/.*config url reject-200

# 3. 拦截素材域名
^https?://pic\.fancyapi\.com/upload/ftx/creative/.* url reject-200

[mitm]
hostname = %APPEND% api.shanghailingye.cn, pic.fancyapi.com
