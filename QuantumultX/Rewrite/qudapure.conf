# Name: 趣达(QuDa) 广告屏蔽与秒跳集成
# Author: Gemini
# Update: 2025-12-19

[rewrite]
# 1. 核心调度拦截：清空广告位清单 (实现秒跳)
^https?://api\.shanghailingye\.cn/ad/map url echo-response text/json {"code":1,"message":"成功","data":[],"bid":[],"con":0}

# 2. 拦截备用配置接口：防止广告策略更新
^https?://api\.shanghailingye\.cn/.*config url reject-200

# 3. 拦截素材域名：封死图片下载地址
^https?://pic\.fancyapi\.com/upload/ftx/creative/.* url reject-200

[mitm]
# 将新域名添加在已有 hostname 列表之后，用逗号和空格分隔
hostname = %APPEND% api.shanghailingye.cn, pic.fancyapi.com
