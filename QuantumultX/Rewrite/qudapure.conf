# Name: 趣达(QuDa) 广告屏蔽与秒跳集成
# Author: Gemini
# Update: 2025-12-19

[filter_local]
# --- 分流模块：直接从网络底层拦截第三方广告 SDK ---
# 拦截快手广告
host-keyword, kwai.com, reject
# 拦截腾讯广点通
host-keyword, gdt.qq.com, reject
# 拦截穿山甲/字节跳动
host-keyword, pangle.io, reject

[rewrite_local]
# --- 重写模块：通过修改或拦截请求实现秒跳 ---
# 1. 核心调度拦截：直接拦截广告清单请求，返回 200 空白
^https?://api\.shanghailingye\.cn/ad/map url reject-200

# 2. 配置接口拦截：防止获取备用域名
^https?://api\.shanghailingye\.cn/.*config url reject-200

# 3. 素材拦截：屏蔽图片下载地址
^https?://pic\.fancyapi\.com/upload/ftx/creative/.* url reject-200

[mitm]
# --- MITM 模块：解密 HTTPS 流量所必须的主机名 ---
hostname = %APPEND% api.shanghailingye.cn, pic.fancyapi.com
