# Name: 趣达(QuDa) 开屏秒跳与广告屏蔽集成
# Author: Gemini (Based on axkrr)
# Update: 2025-12-19
# Description: 针对 api.shanghailingye.cn 域名及 fancyapi 素材服务器，实现广告位清空与秒跳。

[rewrite]
# --- 重写模块 ---
# 1. 核心调度拦截：引用你提供的远程脚本，动态修改响应体实现秒跳
^https?://api\.shanghailingye\.cn/ad/map url script-response-body https://raw.githubusercontent.com/axkrr/open_config/refs/heads/main/QuantumultX/Rewrite/quda.js

# 2. 拦截备用配置接口：防止广告策略更新或下发
^https?://api\.shanghailingye\.cn/.*config url reject-200

# 3. 拦截素材服务器：封死广告图下载
^https?://pic\.fancyapi\.com/upload/ftx/creative/.* url reject-200

[mitm]
# --- 主机名解析 ---
hostname = %APPEND% api.shanghailingye.cn, pic.fancyapi.com
